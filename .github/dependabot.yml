version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "janbernloehr"
    groups:
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "ty"
      astral-tools:
        patterns:
          - "ruff"
          - "ty"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
