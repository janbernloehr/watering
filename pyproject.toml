[project]
name = "watering"
version = "0.3.0"
description = "Smart plant watering system with REST API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jan Bernlöhr" }]
requires-python = ">=3.12"
keywords = ["iot", "raspberry-pi", "watering", "automation", "plants"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "dataset>=1.6.2",
    "rpi-lgpio>=0.6; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.2",
    "httpx>=0.28.1",
    "pre-commit>=4.0.1",
    "ruff>=0.9.2",
    "ty>=0.0.1a3",
]

[project.urls]
Repository = "https://github.com/janbernloehr/watering"

[project.scripts]
watering = "watering.app:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watering"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.2",
    "httpx>=0.28.1",
    "pre-commit>=4.0.1",
    "ruff>=0.9.2",
    "ty>=0.0.1a3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "DTZ",    # flake8-datetimez
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "TRY",    # tryceratops
    "FLY",    # flynt
    "FURB",   # refurb
]
ignore = [
    "S101",    # use of assert (fine in tests)
    "PLR0913", # too many arguments
    "TRY003",  # long exception messages
    "PLC0415", # import not at top level (intentional for lazy imports)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "S108",    # temp file paths fine in tests
    "ANN",     # type annotations optional in tests
    "ARG",     # unused arguments in fixtures
    "PLR2004", # magic values in tests
]
"py/**/*.py" = [
    "ALL",     # legacy code, not modernized
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=watering",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "hardware: marks tests requiring hardware (deselect with '-m \"not hardware\"')",
]

[tool.coverage.run]
source = ["src/watering"]
branch = true
parallel = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]
