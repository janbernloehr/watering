<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#1976d2">

  <title>Watering</title>

  <link rel="apple-touch-icon" href="apple-touch-icon-iphone.png">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <div class="app">
    <!-- Header -->
    <header class="toolbar">
      <h1>Watering <span class="version">v0.3.0</span></h1>
    </header>

    <!-- Watering Controls -->
    <section class="card">
      <div id="controls" class="button-grid">
        <button class="btn btn-primary" data-volume="100">100ml</button>
        <button class="btn btn-primary" data-volume="250">250ml</button>
        <button class="btn btn-primary" data-volume="500">500ml</button>
        <button class="btn btn-primary" data-volume="1000">1000ml</button>
      </div>
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>Watering...</span>
      </div>
    </section>

    <!-- History Section -->
    <header class="toolbar">
      <h2>History</h2>
    </header>

    <section class="card">
      <div class="section-header">
        <h3>Last Refill</h3>
        <button id="refill-btn" class="btn-icon" title="Record refill">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
          </svg>
        </button>
      </div>
      <div id="last-refill" class="refill-info">
        <p class="refill-date">Loading...</p>
        <p class="refill-remaining"></p>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h3>Recent Waterings</h3>
      <ul id="history-list" class="history-list">
        <li class="empty-state">Loading...</li>
      </ul>
    </section>

    <!-- Diagnostics Section -->
    <header class="toolbar">
      <h2>Status</h2>
    </header>

    <section class="card">
      <div id="status" class="status">Ready</div>
    </section>
  </div>

  <!-- Refill Dialog -->
  <dialog id="refill-dialog">
    <form method="dialog">
      <h3>Record Refill</h3>
      <label>
        <span>Volume (ml)</span>
        <input type="number" id="refill-volume" min="100" max="10000" step="100" value="5000" required>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" id="dialog-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js" type="module"></script>
</body>
</html>
